# Filtration / persistence settings
filtration:
  scales: [0.0, 0.5, 2.0]
  fine_scales: [0.0, 0.25, 0.5, 0.75, 1.0, 1.5, 2.0]
  birth_rules:
    - cs               # tau(canon(path))  -- production
    - pairwise         # max tau over 2-subsets
    - facetmax         # recursive max-face birth
    - edge             # bottleneck min-contact distance over path edges
    - shuffled         # within-(graph,order) permutation control
  homology_dims: [0, 1, 2]
  graph_modes: [dir, und]
persistence:
  coefficient_field: 1000003
  rank_method: modular_prime_consensus
  chain_map_check: true
