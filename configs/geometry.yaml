# Geometry / support-solver settings
support:
  solver: exact_active_set          # enumerated affine quadratics, <=4 active balls
  certificate_tol: 4.0e-6
  max_combinations: null            # null = exhaustive within budget
  brute_force_audit: scipy_slsqp    # P0-3 comparator
perturbation:
  bounds_angstrom: [0.05, 0.1, 0.25, 0.5, 1.0]
  reps_per_bound: 100
  seed_base: 0
