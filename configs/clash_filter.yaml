# Steric clash filter (intramolecular extraction ONLY)
# A contact (d between donor/acceptor atom centers) is excluded when
#   d < ratio * (r_vdw_donor + r_vdw_acceptor)
clash:
  enabled: true
  ratio: 0.6            # primary; sensitivity grid in exp07
  sensitivity_ratios: [0.0, 0.5, 0.55, 0.6, 0.65, 0.7]
  applies_to: [rna_intramolecular, protein_intramolecular]
  never_applies_to: [protein_dna_intermolecular]
  audit_field: clash_filtered_count
  disable_env: GSPH_H3_CLASH_RATIO=0
