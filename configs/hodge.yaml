# Shared Hodge spectral readout
hodge:
  inner_product: "G_k = B_k^T B_k + 1e-10 I"
  dense_max_dimension: 384
  retry_dense_max_dimension: 1024   # used for hodge_incomplete recovery
  matrix_free_backend: hodge_matrix_free
  checks:
    - boundary_square_zero
    - chain_map_commutation
    - psd
    - harmonic_nullity_vs_betti   # flagged discrepancies tracked separately
